name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Runs across the whole pnpm/Turborepo workspace (apps/api + packages/*),
      # not just the API app — added when the monorepo scaffold (Phase 1c) landed.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

      # Guarded until a Drizzle schema exists — drizzle-kit fails on an empty
      # migrations folder, and a red CI nobody can fix gets ignored, which
      # defeats the point of gating deploys on it. Remove the guard once the
      # first module schema lands in Phase 2.
      - name: Run migrations
        working-directory: apps/api
        run: |
          if ls drizzle/*.sql >/dev/null 2>&1; then
            npx drizzle-kit migrate
          else
            echo "No Drizzle migrations yet — skipping."
          fi

      - run: pnpm run test
      - run: pnpm --filter cale-api run test:e2e
      - run: pnpm run build
      # Context is the repo root, not apps/api: the Dockerfile needs
      # packages/contracts too, now that apps/api imports @cale/contracts.
      - run: docker build -f apps/api/Dockerfile -t cale-api:${{ github.sha }} .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      # Render's auto-deploy is gone (2026-09-07) — this replaces it. Guarded
      # on secret presence rather than failing outright: the VPS this deploys
      # to doesn't exist yet, and a red required check would block every PR
      # in the meantime. Once VPS_HOST/VPS_SSH_KEY are set as repo secrets,
      # this step starts actually deploying with no other change needed.
      - name: Check deploy secrets are configured
        id: secrets
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::VPS_HOST/VPS_SSH_KEY not set yet — skipping deploy. See PLATFORM_SETUP.md 'Hosting' for setup."
          fi

      - name: Deploy to VPS
        if: steps.secrets.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'deploy' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/cale-api
            git fetch origin main
            git reset --hard origin/main
            cd apps/api
            docker compose -f docker-compose.prod.yml up -d --build
            docker image prune -f
