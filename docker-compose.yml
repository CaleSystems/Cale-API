# Local Postgres, so nobody needs live Neon (or Supabase) credentials just to
# run the backend. `DATABASE_URL=postgresql://postgres:dev@localhost:5432/cale`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: cale
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
